[project]
name = "pos"
version = "0.1.0"
description = "POS — система учёта продаж на PySide6"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
]

[project.scripts]
pos = "pos.app:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
